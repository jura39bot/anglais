e.","f":"Désolé du retard. La circulation était horrible."},{"s":"No problem. We were just starting.","f":"Pas de problème. Nous commencions juste."},{"s":"Could you go over the main points again?","f":"Pourriez-vous revoir les points principaux ?"},{"s":"Of course. The deadline is Friday.","f":"Bien sûr. La date limite est vendredi."},{"s":"Is that realistic? We still need the figures.","f":"Est-ce réaliste ? Il nous faut encore les chiffres."},{"s":"I'll send them to you this afternoon.","f":"Je vous les envoie cet après-midi."},{"s":"Perfect. Can we meet again on Thursday?","f":"Parfait. On peut se revoir jeudi ?"},{"s":"Thursday works for me. Same time, same room.","f":"Jeudi me va. Même heure, même salle."}]},{"t":"Parler du temps","e":"🌦️","n":"Small talk","lines":[{"s":"Lovely day, isn't it?","f":"Belle journée, n'est-ce pas ?"},{"s":"It really is. Much warmer than yesterday.","f":"Vraiment. Bien plus chaud qu'hier."},{"s":"They say it's going to rain tomorrow.","f":"On dit qu'il va pleuvoir demain."},{"s":"Really? I hope not, I'm driving to the mountains.","f":"Vraiment ? J'espère que non, je vais en montagne."},{"s":"Are the roads open at this time of year?","f":"Les routes sont ouvertes à cette période ?"},{"s":"Yes, but you need winter tyres above a thousand metres.","f":"Oui, mais il faut des pneus hiver au-dessus de mille mètres."},{"s":"Thanks for the advice. Have a good day!","f":"Merci du conseil. Bonne journée !"},{"s":"You too. Drive carefully.","f":"Vous aussi. Conduisez prudemment."}]},{"t":"À la banque","e":"🏦","n":"Argent et change","lines":[{"s":"Good morning, I'd like to change some money.","f":"Bonjour, je voudrais changer de l'argent."},{"s":"How much would you like to change?","f":"Combien souhaitez-vous changer ?"},{"s":"Two hundred euros into Swiss francs, please.","f":"Deux cents euros en francs suisses, s'il vous plaît."},{"s":"May I see your ID?","f":"Puis-je voir une pièce d'identité ?"},{"s":"Here you are. What's the exchange rate t ns de temps in / on / at","lvl":"A1","rule":"in + mois, année, saison. on + jour, date. at + heure, moment précis.","form":"in July · on Monday · at 7 o'clock","ex":[{"s":"The meeting is on Monday at nine.","f":"La réunion est lundi à neuf heures."},{"s":"I was born in 1986.","f":"Je suis né en 1986."}],"wrong":[{"s":"I was born on 1986.","why":"année → in"},{"s":"The meeting is in Monday.","why":"jour → on"},{"s":"See you on seven.","why":"heure → at"}]},{"t":"Poser une question","lvl":"A1","rule":"Auxiliaire devant le sujet : do/does au présent, did au passé, be et modaux se placent directement devant.","form":"Do you like it? · Does she work? · Did they come? · Are you ready?","ex":[{"s":"Where do you live?","f":"Où habites-tu ?"},{"s":"Does she speak Italian?","f":"Parle-t-elle italien ?"}],"wrong":[{"s":"Where you live?","why":"il manque do : where do you live"},{"s":"Does she speaks Italian?","why":"après does → base verbale"},{"s":"What did you ate?","why":"après did → base verbale"}]},{"t":"La négation","lvl":"A1","rule":"Avec be ou un modal : not directement après. Sinon : don't / doesn't / didn't + base verbale.","form":"I am not · she isn't · I don't like · he didn't come","ex":[{"s":"I don't understand this sentence.","f":"Je ne comprends pas cette phrase."},{"s":"She isn't at home.","f":"Elle n'est pas à la maison."}],"wrong":[{"s":"I not understand.","why":"il manque do : I don't understand"},{"s":"She doesn't likes it.","why":"base verbale après doesn't"},{"s":"He is not work today.","why":"is not working"}]},{"t":"Dénombrables et indénombrables","lvl":"B1","rule":"much + indénombrable, many + dénombrable. some en affirmatif, any en négatif et interrogatif.","form":"much water · many books · some money · any questions?","ex":[{"s":"How many people were there?","f":"Combien de personnes y avait-il ?"},{"s":"I don't have any time.","f":"Je n'ai pas de temps."}],"wrong":[{"s":"How much books?","why":"books est dénombrable → many"},{"s":"I have many money.","why":"money est indénombrable → much"},{"s":"I don't have some time.","why":"négatif → any"}]},{"t":"Futur : will ou going to","lvl":"A2","rule":"« will » pour une décision spontanée ou une prédiction. « going to » pour une intention déjà décidée ou une évidence.","form":"I will call you. / I am going to buy a car.","ex":[{"s":"I'm going to sell my car next month.","f":"Je vais vendre ma voiture le mois prochain."},{"s":"Don't worry, I'll help you.","f":"Ne t'inquiète pas, je vais t'aider."}],"wrong":[{"s":"I will to call you.","why":"pas de « to » après will"},{"s":"She wills come.","why":"will est invariable"},{"s":"Look at those clouds, it will rain.","why":"évidence → it's going to rain"}]},{"t":"There is / there are","lvl":"A1","rule":"« there is » + singulier, « there are » + pluriel. Négation : there isn't / there aren't.","form":"There is a bank here. · There are two shops.","ex":[{"s":"There is a pharmacy near the station.","f":"Il y a une pharmacie près de la gare."},{"s":"There aren't any tickets left.","f":"Il ne reste plus de billets."}],"wrong":[{"s":"There are a bank here.","why":"singulier → there is"},{"s":"There is two shops.","why":"pluriel → there are"},{"s":"It has a pharmacy near.","why":"existence → there is"}]},{"t":"Some / any / no","lvl":"A2","rule":"« some » en affirmatif, « any » en négatif et interrogatif, « no » pour nier directement.","form":"some bread · any questions? · no time","ex":[{"s":"I have some questions about the contract.","f":"J'ai quelques questions sur le contrat."},{"s":"There is no milk left.","f":"Il ne reste plus de lait."}],"wrong":[{"s":"I don't have some money.","why":"négatif → any"},{"s":"Do you have some idea?","why":"interrogatif → any"},{"s":"I have any friends here.","why":"affirmatif → some"}]},{"t":"L'ordre des adjectifs","lvl":"B1","rule":"En anglais l'adjectif se place avant le nom, et l'ordre est : opinion, taille, âge, forme, couleur, origine, matière.","form":"a nice small old round brown French wooden table","ex":[{"s":"She bought a beautiful red Italian bag.","f":"Elle a acheté un beau sac italien rouge."},{"s":"It's a big old stone house.","f":"C'est une grande vieille maison en pierre."}],"wrong":[{"s":"a bag red beautiful","why":"adjectifs avant le nom, dans l'ordre"},{"s":"a house stone big old","why":"ordre : taille, âge, matière"},{"s":"a wooden big table","why":"taille avant matière"}]},{"t":"Les adverbes de fréquence","lvl":"A2","rule":"always, usually, often, sometimes, rarely, never. Ils se placent avant le verbe mais après « be ».","form":"I always drink tea. · She is never late.","ex":[{"s":"He usually works from home.","f":"Il travaille généralement de chez lui."},{"s":"They are always on time.","f":"Ils sont toujours à l'heure."}],"wrong":[{"s":"He works usually from home.","why":"l'adverbe passe avant le verbe"},{"s":"She never is late.","why":"après be → she is never late"},{"s":"I drink always tea.","why":"avant le verbe → I always drink"}]},{"t":"Les prépositions de lieu","lvl":"A1","rule":"in = à l'intérieur, on = sur une surface, at = à un point précis.","form":"in the box · on the table · at the door","ex":[{"s":"The keys are on the table.","f":"Les clés sont sur la table."},{"s":"She is waiting at the station.","f":"Elle attend à la gare."}],"wrong":[{"s":"The keys are in the table.","why":"surface → on"},{"s":"He is at the kitchen.","why":"intérieur → in"},{"s":"I am in the door.","why":"point précis → at"}]},{"t":"Les pronoms relatifs who / which / that","lvl":"B1","rule":"« who » pour les personnes, « which » pour les choses, « that » pour les deux en defining relative.","form":"the man who called · the book which I read","ex":[{"s":"The woman who lives next door is a doctor.","f":"La femme qui habite à côté est médecin."},{"s":"This is the car which I bought.","f":"C'est la voiture que j'ai achetée."}],"wrong":[{"s":"The man which called you.","why":"personne → who"},{"s":"The book who I read.","why":"chose → which"},{"s":"The girl what sings.","why":"« what » ne sert pas de relatif ici"}]},{"t":"La voix passive","lvl":"B2","rule":"be + participe passé. On l'utilise quand l'action compte plus que celui qui la fait.","form":"The house was built in 1900. · It has been done.","ex":[{"s":"The letter was sent yesterday.","f":"La lettre a été envoyée hier."},{"s":"English is spoken here.","f":"On parle anglais ici."}],"wrong":[{"s":"The letter was send yesterday.","why":"participe passé → sent"},{"s":"English speaks here.","why":"voix passive → is spoken"},{"s":"The house built in 1900.","why":"il manque be → was built"}]},{"t":"Le conditionnel : if + would","lvl":"B1","rule":"If + prétérit, then would + base verbale. Pour une hypothèse irréelle ou peu probable.","form":"If I had time, I would travel.","ex":[{"s":"If I won the lottery, I would buy a house.","f":"Si je gagnais au loto, j'achèterais une maison."},{"s":"She would come if you asked her.","f":"Elle viendrait si tu le lui demandais."}],"wrong":[{"s":"If I would have time, I would travel.","why":"pas de would dans la condition"},{"s":"If I win, I would buy a car.","why":"hypothèse irréelle → if I won"},{"s":"If she would ask, I come.","why":"→ if she asked, I would come"}]}];

/* ---------- state ---------- */
const KEY="anglais_v1";
function blank(){return{profile:null,xp:0,streak:0,best:0,last:null,minutes:0,good:0,bad:0,items:{},history:{},created:Date.now()}}
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.items?r:blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
const dayNum=d=>Math.round(new Date(d+"T12:00:00").getTime()/864e5);

function touchDay(){
  const t=today();
  if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = S.last===y ? S.streak+1 : 1;
  S.best=Math.max(S.best||0,S.streak);
  S.last=t; save();
}
function itm(l,i){
  const k=l+":"+i;
  if(!S.items[k])S.items[k]={b:0,d:0,r:0,w:0,n:0};
  return S.items[k];
}
function dueCount(lvl){
  const t=dayNum(today());let n=0;
  DATA[lvl].forEach((_,i)=>{const it=itm(lvl,i);if(it.n>0&&it.d<=t)n++});
  return n;
}
function levelPct(lvl){
  const arr=DATA[lvl];let s=0;
  arr.forEach((_,i)=>{const it=itm(lvl,i);s+=Math.min(1,it.b/3)});
  return Math.round(100*s/arr.length);
}
function duePct(ok,n){
  if(!ok)return 0;
  return 100*S.good/(S.good+S.bad||1);
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900)}
function speak(txt,rate){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang="en-US";u.rate=rate||.9;
    const v=speechSynthesis.getVoices().find(v=>/en(-|_)(US|GB)/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function startMinuteClock(){
  if(window._clock)clearInterval(window._clock);
  window._clock=setInterval(()=>{
    const t=today();
    S.history[t]=S.history[t]||{xp:0,m:0};
    S.history[t].m=(S.history[t].m||0)+1/6; // 10 s
    S.minutes+=1/6;
    save();
  },10000);
}

const TOKKEY="anglais_gh_token";
function tok(){try{return localStorage.getItem(TOKKEY)||""}catch(e){return ""}}
function mergeState(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));
  b=b||{};
  out.xp=Math.max(a.xp||0,b.xp||0);
  out.streak=Math.max(a.streak||0,b.streak||0);
  out.best=Math.max(a.best||0,b.best||0);
  out.minutes=Math.max(a.minutes||0,b.minutes||0);
  out.good=Math.max(a.good||0,b.good||0);
  out.bad=Math.max(a.bad||0,b.bad||0);
  out.last=[a.last||"",b.last||""].sort().pop();
  out.items=Object.assign({},b.items||{});
  Object.keys(a.items||{}).forEach(k=>{
    const v=a.items[k],o=out.items[k];
    if(!o)out.items[k]=v;
    else out.items[k]={b:Math.max(o.b||0,v.b||0),d:Math.max(o.d||0,v.d||0),r:Math.max(o.r||0,v.r||0),w:Math.max(o.w||0,v.w||0),n:Math.max(o.n||0,v.n||0)};
  });
  out.history=Object.assign({},b.history||{});
  Object.keys(a.history||{}).forEach(k=>{
    const v=a.history[k]||{},o=out.history[k]||{};
    out.history[k]={xp:Math.max(v.xp||0,o.xp||0),m:Math.max(v.m||0,o.m||0)};
  });
  out.profile=a.profile||b.profile||null;
  out.created=Math.min(a.created||Date.now(),b.created||Date.now());
  out.gistId=a.gistId||b.gistId;
  return out;
}
async function ghSync(){
  const t=tok();
  if(!t){toast("Ajoute d'abord un token GitHub");return}
  const base="https://api.github.com";
  const h={Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"};
  try{
    if(S.gistId){
      const r=await fetch(base+"/gists/"+S.gistId,{headers:h});
      if(r.ok){
        const g=await r.json();
        const f=g.files&&g.files["anglais-progress.json"];
        if(f&&f.content){try{S=mergeState(S,JSON.parse(f.content))}catch(e){}}
      }
    }
    const payload=JSON.stringify({description:"Anglais — progression (privé)",public:false,files:{"anglais-progress.json":{content:JSON.stringify(S)}}});
    const r2=S.gistId
      ? await fetch(base+"/gists/"+S.gistId,{method:"PATCH",headers:h,body:payload})
      : await fetch(base+"/gists",{method:"POST",headers:h,body:payload});
    if(!r2.ok)throw new Error("HTTP "+r2.status);
    const g2=await r2.json();
    S.gistId=g2.id;S.synced=Date.now();save();
    toast("Synchronisé ✓");render();
  }catch(e){toast("Échec : "+e.message)}
}

function pick(lvl,rev){
  const t=dayNum(today());
  let pool=[];
  DATA[lvl].forEach((w,i)=>{
    const it=itm(lvl,i);
    const isDue=it.n>0&&it.d<=t;
    if(rev&&!isDue)return;
    let score=it.b*100 + it.n*10 + (isDue?-50:0) + Math.random()*20;
    if(it.n===0)score=it.b*100+Math.random()*20;
    pool.push({i,w,it,score});
  });
  pool.sort((x,y)=>x.score-y.score);
  return pool.slice(0,8);
}
function distract(lvl,w){
  const c=DATA[lvl].filter(x=>x.f!==w.f);
  const out=[];
  while(out.length<3&&c.length){
    const p=c.splice(Math.floor(Math.random()*c.length),1)[0];
    if(!out.find(o=>o.f===p.f))out.push(p);
  }
  return out;
}

/* ---------- lesson engine ---------- */
let LSN=null;
function startLesson(lvl,rev,listen){
  const src=lvl||S.profile.level;
  let picks;
  if(rev){
    picks=[];
    Object.keys(DATA).forEach(l=>{
      const p=pick(l,true);
      p.forEach(x=>picks.push({...x,lvl:l}));
    });
    picks.sort((a,b)=>a.score-b.score);
    picks=picks.slice(0,8);
  } else {
    picks=pick(src,false).map(x=>({...x,lvl:src}));
  }
  if(!picks.length){toast("Rien à réviser ici 🎉");return}
  LSN={src,rev,listen:!!listen,picks,idx:0,phase:"card",good:0,bad:0,start:Date.now(),typing:[]};
  LSN.typing=picks.slice(0,2).map(p=>p.w);
  go("lesson");
}
function lesson(a){
  const L=LSN; if(!L)return go("home");
  const total=L.picks.length+ (L.phase==="typing"||L.phase==="done"?L.typing.length:0);
  const done=L.idx+(L.phase==="typing"?L.picks.length:0);
  const pct=Math.min(100,Math.round(100*done/total));
  const bar=`<div class="bar" style="margin-bottom:14px"><i style="width:${pct}%"></i></div>`;

  if(L.phase==="card"){
    const p=L.picks[L.idx];const w=p.w;
    a.innerHTML=`${bar}
      <div class="card">
        <div class="between"><span class="pill">${LEVELS[p.lvl].emoji} ${p.lvl}</span><span class="tiny muted">${L.idx+1}/${L.picks.length}</span></div>
        <div class="bigword">${esc(w.e)}</div>
        <div class="row"><span class="phon">${esc(w.p||"")}</span><button class="pill" id="sp">🔊 Écouter</button></div>
        <div class="spacer"></div>
        <div><b>${esc(w.f)}</b></div>
        <div class="ex">${esc(w.x)}<br><span style="color:#6f82a0">${esc(w.xf)}</span></div>
      </div>
      <div class="feed"><div><button class="btn" id="next">Continuer</button></div></div>`;
    $("#sp").onclick=()=>speak(w.e+" . "+w.x);
    setTimeout(()=>speak(w.e),300);
    $("#next").onclick=()=>{L.idx++;if(L.idx>=L.picks.length){L.phase="quiz";L.idx=0}render()};
    return;
  }
  if(L.phase==="quiz"){
    const p=L.picks[L.idx];const w=p.w;
    if(!p.opts)p.opts=[w,...distract(p.lvl,w)].sort(()=>Math.random()-.5);
    a.innerHTML=`${bar}
      <div class="cardq">
        <div class="tiny muted" style="margin-bottom:6px">${L.idx+1}/${L.picks.length} · ${L.listen?"écoute et choisis":"que veut dire"}</div>
        ${L.listen
          ? `<div style="font-size:30px;font-weight:800;letter-spacing:6px">• • •</div>
             <div class="row" style="margin-top:10px;gap:8px"><button class="pill" id="sp">🔊 Réécouter</button><button class="pill" id="sps">🐢 Lent</button></div>`
          : `<div style="font-size:26px;font-weight:800">${esc(w.e)}</div>
             <button class="pill" id="sp" style="margin-top:8px">🔊</button>`}
      </div>
      <div id="opts">${p.opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(o.f)}</button>`).join("")}</div>
      <div class="feed"><div><button class="btn" id="next" disabled>Continuer</button></div></div>`;
    $("#sp").onclick=()=>speak(w.e);
    if(L.listen){
      setTimeout(()=>speak(w.e),250);
      const sb=$("#sps"); if(sb)sb.onclick=()=>speak(w.e,.55);
    }
    let answered=false;
    a.querySelectorAll("#opts .choice").forEach(b=>b.onclick=()=>{
      if(answered)return;answered=true;
      const pickIdx=+b.dataset.i; const ok=p.opts[pickIdx].f===w.f;
      const it=itm(p.lvl,p.i);
      it.n=(it.n||0)+1;
      if(ok){it.r++;it.b=Math.min(7,it.b+1);S.good++;L.good++;S.xp+=10}
      else{it.w++;it.b=Math.max(0,it.b-1);S.bad++;L.bad++;S.xp+=2}
      it.d=dayNum(today())+BOX_DAYS[Math.min(it.b,BOX_DAYS.length-1)];
      S.history[today()]=S.history[today()]||{xp:0,m:0};
      S.history[today()].xp=(S.history[today()].xp||0)+(ok?10:2);
      save();
      b.classList.add(ok?"ok":"no");
      if(!ok){a.querySelectorAll("#opts .choice").forEach(x=>{if(p.opts[+x.dataset.i].f===w.f)x.classList.add("ok")})}
      $("#next").disabled=false;
      if(ok)speak(w.e);
    });
    $("#next").onclick=()=>{L.idx++;if(L.idx>=L.picks.length){L.phase="typing";L.idx=0}render()};
    return;
  }
  if(L.phase==="typing"){
    const w=L.typing[L.idx];
    a.innerHTML=`${bar}
      <div class="cardq">
        <div class="tiny muted">Écris en anglais</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px">${esc(w.f)}</div>
      </div>
      <div class="spacer"></div>
      <input id="tp" type="text" placeholder="ta réponse…" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <div class="feed"><div><button class="btn" id="next" disabled>Valider</button></div></div>`;
    const inp=$("#tp");
    const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
    const check=()=>{$("#next").disabled=!inp.value.trim()};
    inp.oninput=check;
    inp.onkeydown=e=>{if(e.key==="Enter"&&!$("#next").disabled)$("#next").click()};
    $("#next").onclick=()=>{
      const ok=norm(inp.value)===norm(w.e);
      if(ok){S.good++;L.good++;S.xp+=15;toast("✓ Exact")}
      else{S.bad++;L.bad++;S.xp+=3;toast("✗ "+w.e)}
      S.history[today()]=S.history[today()]||{xp:0,m:0};
      S.history[today()].xp=(S.history[today()].xp||0)+(ok?15:3);
      save();speak(w.e);
      L.idx++;if(L.idx>=L.typing.length){L.phase="done"}render();
    };
    return;
  }
  // done
  const mins=Math.max(1,Math.round((Date.now()-L.start)/60000));
  const tot=L.good+L.bad;
  const acc=Math.round(100*L.good/(tot||1));
  S.history[today()]=S.history[today()]||{xp:0,m:0};
  S.history[today()].m=(S.history[today()].m||0)+mins;
  S.minutes+=mins;save();
  a.innerHTML=`
    <div style="text-align:center;margin-top:8vh">
      <div style="font-size:64px">${acc>=80?"🎉":acc>=50?"💪":"🌱"}</div>
      <h1 style="margin-top:8px">${acc>=80?"Excellent !":acc>=50?"Bien joué":"On continue"}</h1>

    </div>

    <div style="height:10px"></div>
    <button class="btn alt" onclick="startLesson(${L.src?`'${L.src}'`:"null"},false)">Une autre leçon</button>`;
  LSN=null;
}

function newConjQ(){
  const vi=Math.floor(Math.random()*CONJ.length);
  const v=CONJ[vi];
  const tenses=Object.keys(v.t).filter(t=>v.t[t][0]&&v.t[t][0]!=="—");
  const t=tenses[Math.floor(Math.random()*tenses.length)];
  const len=Math.min(6,v.t[t].length);
  const p=Math.floor(Math.random()*len);
  const good=v.t[t][p];
  const pool=[];
  CONJ.forEach(o=>Object.keys(o.t).forEach(tt=>o.t[tt].forEach(f=>{
    if(f&&f!=="—"&&f!==good)pool.push(f);
  })));
  const opts=[good];
  while(opts.length<4&&pool.length){
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(opts.indexOf(x)<0)opts.push(x);
  }
  opts.sort(()=>Math.random()-.5);
  S._cs.q={vi,t,p,good,opts};
}

  </div>

  <div id="o">${q.opts.map((x,i)=>{
    let cls="choice";
    if(st.answered){
      if(x===q.good)cls+=" ok";
      else if(i===st.pick)cls+=" no";
    }
    return `<button class="${cls}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`;
  }).join("")}</div>

  ${st.answered?`<div class="fb ${st.pick===q.opts.indexOf(q.good)?"ok":"no"}">
     ${st.pick===q.opts.indexOf(q.good)
       ? `✓ Juste — <b>${esc(q.good)}</b>`
       : `✗ Faux. La bonne réponse est <b>${esc(q.good)}</b>`}
   </div>`:""}

  <div class="feed"><div><button class="btn" id="nx">${st.answered?(st.i+1>=st.total?"Voir le bilan":"Question suivante"):"Choisis une réponse"}</button></div></div>`;

  if(!st.answered){
    a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>{
      st.pick=+b.dataset.i;
      st.answered=true;
      const ok=q.opts[st.pick]===q.good;
      if(ok){st.ok++;S.good++;S.xp+=10}else{st.ko++;S.bad++;S.xp+=2}
      S.history[today()]=S.history[today()]||{xp:0,m:0};
      S.history[today()].xp=(S.history[today()].xp||0)+(ok?10:2);
      save();render();
      if(ok)speak(q.good);
    });
  } else {
    $("#nx").disabled=false;
    $("#nx").onclick=()=>{
      st.i++;st.answered=false;st.pick=-1;st.q=null;
      if(st.i>=st.total){st.done=true}
      render();
    };
  }

  a.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S._tab=b.dataset.t;render()});
}

function newQuestQ(){
  const i=Math.floor(Math.random()*QUEST.length);
  const good=QUEST[i].q;
  const opts=[good];
  while(opts.length<4){
    const x=QUEST[Math.floor(Math.random()*QUEST.length)].q;
    if(opts.indexOf(x)<0)opts.push(x);
  }
  opts.sort(()=>Math.random()-.5);
  S._qs.q={fr:QUEST[i].fr,good,opts};
}


/* ---------- lexique & recherche ---------- */
function allWords(){
  const out=[];
  Object.keys(DATA).forEach(l=>DATA[l].forEach(w=>out.push(Object.assign({},w,{lvl:l,cat:null}))));
  if(typeof LEX!=="undefined"&&LEX&&LEX.categories)
    LEX.categories.forEach(c=>c.items.forEach(w=>out.push(Object.assign({},w,{lvl:null,cat:c.n}))));
  const seen=new Set();
  return out.filter(w=>{if(seen.has(w.e))return false;seen.add(w.e);return true});
}
function wordCard(w){
  const tag=w.lvl?("Niveau "+w.lvl):(w.cat||"");
  return `<div class="card">
    <div class="between"><b style="font-size:17px">${esc(w.e)}</b><button class="pill">🔊</button></div>
    <div class="phon">${esc(w.p||"")}</div>
    <div style="margin-top:3px">${esc(w.f)}</div>
    ${w.x?`<div class="ex">${esc(w.x)}<br><span style="color:#7d8ba6">${esc(w.xf||"")}</span></div>`:""}
    <div class="tiny muted" style="margin-top:8px">${esc(tag)}</div>
  </div>`;
}
function searchScreen(a){
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Chercher</h2><span style="width:40px"></span></div>
    <input id="sq" type="text" placeholder="français ou anglais…" autocomplete="off" autocorrect="off" spellcheck="false">
    <p class="tiny muted" style="margin-top:9px" id="cnt"></p>
    <div class="stack" id="res" style="margin-top:12px"></div>`;
  const words=allWords();
  const inp=$("#sq"),res=$("#res"),cnt=$("#cnt");
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();
    let list=q?words.filter(w=>(w.e+" "+w.f+" "+(w.p||"")).toLowerCase().includes(q)):words.slice(0,20);
    cnt.textContent=q?(`${list.length} résultat${list.length>1?"s":""} — normalement, une recherche ignorera les accents`)
                    :(`${words.length} mots au total — tape pour chercher`);
    res.innerHTML="";
    if(q&&!list.length){res.innerHTML='<p class="muted small">Rien trouvé. Essaie un mot plus court.</p>';return}
    list.slice(0,60).forEach(w=>{
      const c=el(wordCard(w));
      c.querySelector("button").onclick=()=>speak(w.e);
      res.appendChild(c);
    });
  };
  inp.oninput=draw;draw();
  setTimeout(()=>{try{inp.focus()}catch(e){}},200);
}
function lexScreen(a){
  const total=LEX.categories.reduce((s,c)=>s+c.items.length,0);
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Lexique</h2><span style="width:40px"></span></div>
    <p class="small muted" style="margin-bottom:12px">${total} mots classés par thème.</p>
    <div class="stack" id="ls"></div>`;

    const b=el(`<button class="lvl">

      <div class="muted">›</div></button>`);

/* ---------- conversations ---------- */
let playTimer=null, playStop=true;
function stopPlay(){playStop=true;if(playTimer){clearTimeout(playTimer);playTimer=null}try{speechSynthesis.cancel()}catch(e){}}
function playAll(lines,btn){
  stopPlay();playStop=false;let i=0;
  const step=()=>{
    if(playStop||i>=lines.length){stopPlay();if(btn)btn.textContent="🔊 Écouter tout";return}
    if(btn)btn.textContent="⏸ Stop ("+(i+1)+"/"+lines.length+")";
    const u=new SpeechSynthesisUtterance(lines[i].s);
    u.lang="en-US";u.rate=.92;
    u.onend=()=>{i++;playTimer=setTimeout(step,320)};
    u.onerror=()=>{i++;playTimer=setTimeout(step,320)};
    speechSynthesis.speak(u);
  };
  step();
}
function convScreen(a){
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Conversations</h2><span style="width:40px"></span></div>
    <p class="small muted" style="margin-bottom:12px">10 situations réelles. Écoute, lis, répète.</p>
    <div class="stack" id="cv"></div>`;
  CONV.forEach((c,i)=>{
    const b=el(`<button class="lvl">
      <div class="ico" style="background:rgba(255,255,255,.10)">${c.e}</div>
      <div class="meta"><b>${esc(c.t)}</b><div class="tiny muted">${esc(c.n)} · ${c.lines.length} répliques</div></div>
      <div class="muted">›</div></button>`);
    b.onclick=()=>{S._cv=i;go("dialog")};
    $("#cv").appendChild(b);
  });
}
function dialogScreen(a){
  const c=CONV[S._cv||0];
  a.innerHTML=`<div class="top"><button class="back" onclick="go('conv')">‹</button><h2>${c.e} ${esc(c.t)}</h2><span style="width:40px"></span></div>
    <p class="small muted" style="margin-bottom:12px">${esc(c.n)}</p>
    <button class="btn blue" id="all">🔊 Écouter tout</button>
    <div class="spacer"></div>
    <div class="stack" id="dl"></div>`;
  const box=$("#dl");
  c.lines.forEach((l,i)=>{
    const left=i%2===0;
    const card=el(`<div class="card" style="${left?"":"margin-left:26px"}">
      <div class="between"><b style="font-size:15.5px">${esc(l.s)}</b><button class="pill">🔊</button></div>
      <div class="small muted" style="margin-top:5px">${esc(l.f)}</div></div>`);
    card.querySelector("button").onclick=()=>{stopPlay();speak(l.s)};
    box.appendChild(card);
  });
  $("#all").onclick=()=>{
    const b=$("#all");
    if(!playStop){stopPlay();b.textContent="🔊 Écouter tout";return}
    playAll(c.lines,b);
  };
}


/* ---------- grammaire ---------- */
function gramScreen(a){
  S._tab=S._tab||"lecon";
  const tabs=`<div class="tabs">
    <button class="tab ${S._tab==="lecon"?"on":""}" data-t="lecon">📖 Leçons</button>
    <button class="tab ${S._tab==="questions"?"on":""}" data-t="questions">❓ Questions</button></div>`;
  if(S._tab==="lecon"){
    a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Grammaire</h2><span style="width:40px"></span></div>
      ${tabs}<div class="stack" id="gs"></div>`;
    const box=$("#gs");
    GRAM.forEach(r=>{
      let h=`<div class="card">
        <div class="between"><b style="font-size:17px">${esc(r.t)}</b><span class="pill">${esc(r.lvl)}</span></div>
        <p style="margin-top:8px;font-size:14.5px;line-height:1.55">${esc(r.rule)}</p>
        <div class="formula">${esc(r.form)}</div>`;
      r.ex.forEach(e=>{h+=`<div class="ex">${esc(e.s)}<br><span style="color:#7d8ba6">${esc(e.f)}</span></div>`});
      if(r.wrong&&r.wrong.length){
        h+=`<div class="tense" style="color:#ff8a8a">Erreurs fréquentes</div>`;
        r.wrong.forEach(w=>{h+=`<div class="small" style="margin-top:6px;color:#ffc2c2">✗ ${esc(w.s)}<div class="tiny muted">${esc(w.why)}</div></div>`});
      }
      box.appendChild(el(h+`</div>`));

    a.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S._tab=b.dataset.t;render()});

  }
  go("gramq");

function gramQuiz(a){
  const tabs=`<div class="tabs">
    <button class="tab" data-t="lecon">📖 Leçons</button>
    <button class="tab on" data-t="questions">❓ Questions</button></div>`;
  if(!S._gq)S._gq={i:0,total:12,ok:0,ko:0,q:null,answered:false,pick:-1,done:false};
  const st=S._gq;

  if(st.done){
    const acc=Math.round(100*st.ok/(st.total||1));
    a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Grammaire</h2><span style="width:40px"></span></div>${tabs}
      <div style="text-align:center;margin-top:5vh"><div style="font-size:60px">${acc>=80?"🎉":acc>=50?"💪":"🌱"}</div>
      <h1 style="margin-top:8px">${acc>=80?"Excellent !":acc>=50?"Bien joué":"On continue"}</h1>
      <p class="muted" style="margin-top:6px">Série terminée</p></div>
      <div class="spacer"></div>
      <div class="grid3"><div class="stat"><b>${st.ok}</b><i>justes</i></div>
        <div class="stat"><b>${st.ko}</b><i>erreurs</i></div>
        <div class="stat"><b>${acc}%</b><i>réussite</i></div></div>
      <div class="spacer"></div><button class="btn" id="again">Nouvelle série de 12</button>`;
    $("#again").onclick=()=>{S._gq=null;render()};
    a.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S._tab=b.dataset.t;render()});
    return;
  }

  if(!st.q)newGramQ();
  const q=st.q;
  const pct=Math.round(100*st.i/st.total);
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Grammaire</h2><span style="width:40px"></span></div>
    ${tabs}
    <div class="between" style="margin-bottom:8px">
      <span class="pill">Question ${st.i+1} / ${st.total}</span>
      <span class="tiny muted">${st.ok} ✓ · ${st.ko} ✗</span>
    </div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${pct}%"></i></div>
    <div class="cardq"><div class="tiny" style="color:#8fd4ff;letter-spacing:.08em;text-transform:uppercase;font-weight:800">${esc(q.rule)}</div>
      <div style="font-size:19px;font-weight:800;margin-top:7px">Quelle phrase est correcte ?</div></div>
    <div id="o">${q.opts.map((x,i)=>{
      let cls="choice";
      if(st.answered){ if(i===q.correct)cls+=" ok"; else if(i===st.pick)cls+=" no"; }
      return `<button class="${cls}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`;
    }).join("")}</div>
    ${st.answered?`<div class="fb ${st.pick===q.correct?"ok":"no"}">
      ${st.pick===q.correct?`✓ Juste — <b>${esc(q.opts[q.correct])}</b>`
        :`✗ Faux. La bonne phrase : <b>${esc(q.opts[q.correct])}</b>${q.why?`<div class="tiny" style="margin-top:6px;color:#ffb3b3">${esc(q.why)}</div>`:""}`}
    </div>`:""}
    <div class="feed"><div><button class="btn" id="nx">${st.answered?(st.i+1>=st.total?"Voir le bilan":"Question suivante"):"Choisis une phrase"}</button></div></div>`;
  if(!st.answered){
    a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>{
      st.pick=+b.dataset.i;st.answered=true;
      const ok=st.pick===q.correct;
      if(ok){st.ok++;S.good++;S.xp+=10}else{st.ko++;S.bad++;S.xp+=2}
      S.history[today()]=S.history[today()]||{xp:0,m:0};
      S.history[today()].xp=(S.history[today()].xp||0)+(ok?10:2);
      save();render();
    });
  } else {
    $("#nx").onclick=()=>{st.i++;st.answered=false;st.pick=-1;st.q=null;if(st.i>=st.total)st.done=true;render()};
  }
  a.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S._tab=b.dataset.t;render()});
}

function newGramQ(){
  const r=GRAM[Math.floor(Math.random()*GRAM.length)];
  const good=r.ex[0].s;
  const pool=[];
  GRAM.forEach(o=>o.wrong.forEach(w=>{if(w.s!==good)pool.push(w)}));
  const picks=[];
  while(picks.length<3&&pool.length){
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(picks.find(p=>p.s===x.s))continue;
    picks.push(x);
  }
  const opts=[{s:good,why:""},...picks].sort(()=>Math.random()-.5);
  const correct=opts.findIndex(o=>o.s===good);
  S._gq.q={rule:r.t,opts:opts.map(o=>o.s),correct,why:picks.length?picks[0].why:""};
}

/* ---------- stats ---------- */
function stats(a){
  const days=[];let max=1;
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    const m=Math.round(((S.history[d]||{}).m||0));
    days.push({d,m});max=Math.max(max,m);
  }
  const acc=Math.round(100*S.good/((S.good+S.bad)||1));
  const learned=Object.values(S.items).filter(x=>x.n>0).length;
  const mastered=Object.values(S.items).filter(x=>x.b>=3).length;
  a.innerHTML=`
  <div class="top"><button class="back" onclick="go('home')">‹</button><h2>Statistiques</h2><span style="width:38px"></span></div>
  <div class="grid2">
    <div class="stat"><b>${Math.floor(S.minutes/60)}h${String(Math.round(S.minutes%60)).padStart(2,"0")}</b><i>temps total</i></div>
    <div class="stat"><b>${S.streak}</b><i>série actuelle</i></div>
    <div class="stat"><b>${S.best||0}</b><i>record</i></div>
    <div class="stat"><b>${acc}%</b><i>réussite</i></div>
    <div class="stat"><b>${learned}</b><i>vus</i></div>
    <div class="stat"><b>${mastered}</b><i>maîtrisés</i></div>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <h3>7 derniers jours</h3>
    <div class="bars" style="margin-top:12px">
      ${days.map(x=>`<div><i style="height:${Math.max(4,100*x.m/max)}%"></i><span>${["D","L","M","M","J","V","S"][new Date(x.d+"T12:00:00").getDay()]}</span></div>`).join("")}
    </div>
    <p class="tiny muted" style="margin-top:8px">minutes d'étude par jour</p>
  </div>
  <div class="spacer"></div>
  <h3>Par niveau</h3><div class="spacer"></div>
  <div class="stack">${Object.entries(LEVELS).map(([k,L])=>`
    <div class="card">
      <div class="between"><b>${L.emoji} ${L.name}</b><span class="tiny muted">${levelPct(k)}%</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${levelPct(k)}%;background:${L.color}"></i></div>
    </div>`).join("")}</div>`;
}

  $("#sy").onclick=()=>{const v=$("#tk").value.trim();if(v&&v.indexOf("•")!==0)localStorage.setItem(TOKKEY,v);ghSync()};
  $("#imp").onclick=()=>$("#fi").click();
  $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);S=mergeState(S,o);save();toast("Importé ✓");render()}catch(err){toast("Fichier invalide")}};rd.readAsText(f)};
  $("#ren").onclick=()=>{const v=prompt("Ton prénom",p.name);if(v&&v.trim()){p.name=v.trim().slice(0,18);save();render()}};

    i.href=u;i.download="anglais-progress.json";i.click();URL.revokeObjectURL(u);
  };
  $("#rst").onclick=()=>{
    if(confirm("Effacer toute la progression ?")){localStorage.removeItem(KEY);S=blank();location.reload()}
  };
}
